# PR と main の両方で「検査 → ビルド」を同じ手順で走らせる（ADR-0007）。
# - pull_request: build ジョブだけ走り、赤なら Ruleset がマージを止める
# - push(main):   build が緑なら deploy ジョブが GitHub Pages に公開（FR-022 / SC-008）
# npm test が赤なら build ジョブごと失敗し、公開されない（SC-009 / ADR-0005）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# main への公開は直列（Pages のデプロイは同時に1つ）。PR の検査は PR ごとに独立させ、
# 同じ PR への連続 push は古い実行を打ち切る。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 完了条件の検査とテスト（赤なら公開しない）
        run: npm test
      - run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    # main に入ったときだけ公開する。PR ではここは走らない
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
